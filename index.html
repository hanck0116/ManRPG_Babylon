<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManRPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div id="floorInfo">Floor: 1</div>
    <div id="progressInfo">Lv 1 | Stat Pts 0 | Coin 0</div>
    <div id="playerHp">플레이어 HP: 100 / 100</div>
    <div id="playerMp">플레이어 MP: 100 / 100</div>
    <div id="enemyHp">적 HP: 100 / 100</div>
    <div id="mantraInfo">만트라: 화염</div>
    <div id="spellInfo">마법: 화염구</div>
    <select id="magicSelect"></select>
    <div id="magicCooldownInfo">마법 쿨타임: 0.0s</div>
    <div id="manualInfo">외공서 0 | 내공서 0 | 검기 0</div>
    <div id="swordStageInfo">검기 단계: 없음 (0)</div>
    <div id="battleMessage"></div>
    <div id="actionFeedback"></div>
  </div>

  <div id="mobileJoystick" aria-hidden="true">
    <div id="joystickBase">
      <div id="joystickKnob"></div>
    </div>
  </div>
  <div id="actionButtons">
    <button id="attackBtn" type="button">공격</button>
    <button id="dodgeBtn" type="button">회피</button>
    <button id="guardBtn" type="button">가드</button>
    <button id="magicBtn" type="button">마법</button>
    <button id="lockBtn" type="button">락온</button>
  </div>
  <div id="innerWorld" class="hidden">
    <h2>심상세계</h2>
    <p id="innerStepText">회복 중...</p>
    <div id="rewardPanel" class="hidden">
      <h3>보상 선택 (2개 중 1개)</h3>
      <div id="rewardChoices"></div>
      <button id="rerollBtn" type="button">리롤(코인 1)</button>
    </div>
    <div id="manualPanel" class="hidden">
      <h3>무공서</h3>
      <div id="manualCounts"></div>
      <button id="useExternalBtn" type="button">외공서 사용</button>
      <button id="useInternalBtn" type="button">내공서 사용</button>
      <button id="useSwordBtn" type="button">검기 사용</button>
      <button id="manualDoneBtn" type="button">무공서 단계 완료</button>
    </div>
    <div id="spellBookPanel" class="hidden">
      <h3>마법서</h3>
      <div id="spellBookList"></div>
      <div id="learnResult"></div>
      <div id="learnedMagicList"></div>
      <button id="learnSpellBtn" type="button">마법서 습득 시도</button>
      <button id="extraLearnBtn" type="button">추가 시도(코인1)</button>
      <button id="spellBookDoneBtn" type="button">마법서 단계 완료</button>
    </div>
    <div id="shopPanel" class="hidden">
      <h3>상점</h3>
      <button id="buyExternalBtn" type="button">외공서 구매(10코인)</button>
      <button id="buyInternalBtn" type="button">내공서 구매(10코인)</button>
      <button id="buySwordBtn" type="button">검기 구매(30코인)</button>
      <button id="buyTicketBtn" type="button">무공서 뽑기권 구매(8코인)</button>
      <button id="drawTicketBtn" type="button">뽑기권 사용</button>
      <button id="sellExternalBtn" type="button">외공서 판매(5코인)</button>
      <button id="sellInternalBtn" type="button">내공서 판매(5코인)</button>
      <button id="sellSwordBtn" type="button">검기 판매(12코인)</button>
      <button id="shopDoneBtn" type="button">상점 단계 완료</button>
    </div>
    <div id="statPanel" class="hidden">
      <h3>스탯 투자</h3>
      <div id="statList"></div>
      <button id="statDoneBtn" type="button">투자 완료</button>
    </div>
    <button id="nextFloorBtn" class="hidden" type="button">다음 층 진입</button>
  </div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="src/stats.js"></script>
  <script src="src/rewards.js"></script>
  <script src="src/inventory.js"></script>
  <script src="src/magicData.js"></script>
  <script src="src/spellBooks.js"></script>
  <script src="src/shop.js"></script>
  <script src="src/innerWorld.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/maps/floorMaps.js"></script>
  <script src="src/maps/innerWorldMap.js"></script>
  <script src="src/mapManager.js"></script>
  <script src="main.js"></script>
</body>
</html>
