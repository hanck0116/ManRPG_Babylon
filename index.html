<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManRPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div id="playerHp">플레이어 HP: 100 / 100</div>
    <div id="enemyHp">적 HP: 100 / 100</div>
    <div id="battleMessage"></div>
  </div>

  <div id="mobileJoystick" aria-hidden="true">
    <div id="joystickBase">
      <div id="joystickKnob"></div>
    </div>
  </div>
  <div id="actionButtons">
    <button id="attackBtn" type="button">공격</button>
    <button id="dodgeBtn" type="button">회피</button>
    <button id="guardBtn" type="button">가드</button>
  </div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="main.js"></script>
</body>
</html>
